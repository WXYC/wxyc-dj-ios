name: WXYCDJ
options:
  bundleIdPrefix: org.wxyc
  deploymentTarget:
    iOS: "18.4"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    DEVELOPMENT_TEAM: 92V374HC38
    CODE_SIGN_STYLE: Automatic
    SUPPORTED_PLATFORMS: "iphonesimulator iphoneos"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO

packages:
  WXYCAPI:
    path: Packages/WXYCAPI

targets:
  WXYCDJ:
    type: application
    platform: iOS
    sources:
      - path: WXYCDJ
    dependencies:
      - package: WXYCAPI
    # A physical Info.plist (generated by xcodegen from these properties) rather
    # than GENERATE_INFOPLIST_FILE synthesis: UIBackgroundModes and the
    # BGTaskSchedulerPermittedIdentifiers array (issue #19 step 5) aren't
    # expressible as INFOPLIST_KEY_* settings. The keys formerly synthesized via
    # INFOPLIST_KEY_* (display name, scene manifest, launch screen, orientations)
    # are re-declared here.
    info:
      path: WXYCDJ/Info.plist
      properties:
        CFBundleDisplayName: WXYC DJ
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - org.wxyc.dj.catalog.refresh
          - org.wxyc.dj.catalog.reindex
         NSCameraUsageDescription: WXYC DJ uses the camera to scan the QR code shown on the dj.wxyc.org sign-in screen.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.wxyc.dj
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: WXYCDJ/WXYCDJ.entitlements
    scheme:
      testTargets:
        - WXYCDJTests
      gatherCoverageData: false
      environmentVariables:
        WXYC_SPOTLIGHT_TOLERANCE: "1"
        WXYC_SPOTLIGHT_FIELD_RESOLUTION: "1"

  WXYCDJTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WXYCDJTests
    dependencies:
      - target: WXYCDJ
      - package: WXYCAPI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.wxyc.dj.tests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES

name: WXYCDJ
options:
  bundleIdPrefix: org.wxyc
  deploymentTarget:
    iOS: "18.4"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    DEVELOPMENT_TEAM: 92V374HC38
    CODE_SIGN_STYLE: Automatic
    SUPPORTED_PLATFORMS: "iphonesimulator iphoneos"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO

packages:
  WXYCAPI:
    path: Packages/WXYCAPI
  # WXYCAPI depends on this transitively (issue #75) -- and the app
  # genuinely depends on it too, not merely as a build-graph technicality:
  # WXYCAPI's public typealiases (TrackMatchHint, APIErrorResponse, ...)
  # transparently re-export WXYCAPIModels types, so any app code touching
  # those DTOs already depends on this module whether or not Xcode's
  # implicit linking would have found it. That implicit linking is also
  # unreliable in practice: it doesn't always pick up a nested local
  # package's product for every link product of a consuming app target
  # (observed: the app's own debug dylib -- used for test injection --
  # fails to link with an undefined-symbol error for WXYCAPIModels types,
  # even though the app's main executable links fine in the same build).
  # Declaring it as a direct package dependency of the app targets below
  # fixes the linking gap and makes the real dependency explicit. This is
  # NOT license to `import WXYCAPIModels` directly from WXYCDJ/ -- see
  # CLAUDE.md's "Code Generation" section.
  WXYCAPIModels:
    path: Packages/WXYCAPIModels
  # Crash/error reporting (issue #106). `upToNextMajorVersion` -- the same
  # range style wxyc-ios-64/WXYC.xcodeproj declares for the same package --
  # rather than an exact pin, so a patch release (bug fixes on a
  # crash-reporting SDK) can flow in without a manual bump. 8.58.4 is that
  # range's currently-resolved version, tracked reproducibly via the
  # checked-in Package.resolved (see .gitignore), not by this floor alone.
  # Linked to the WXYCDJ app target ONLY -- never to WXYCAPI/WXYCAPIModels
  # (those packages are pure Foundation and must stay host-testable via
  # `swift test`) and never to WXYCDJTests (sentry-cocoa is largely ObjC;
  # statically linking it into both the host app and its loaded test bundle
  # would produce duplicate ObjC class registration -- WXYCDJTests reaches
  # Sentry-touching code only through the WXYCDJ.Telemetry seam it already
  # loads via @testable import, never by importing Sentry itself).
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa.git
    from: 8.58.4

targets:
  WXYCDJ:
    type: application
    platform: iOS
    sources:
      - path: WXYCDJ
    dependencies:
      - package: WXYCAPI
      - package: WXYCAPIModels
      - package: Sentry
    # A physical Info.plist (generated by xcodegen from these properties) rather
    # than GENERATE_INFOPLIST_FILE synthesis: UIBackgroundModes and the
    # BGTaskSchedulerPermittedIdentifiers array (issue #19 step 5) aren't
    # expressible as INFOPLIST_KEY_* settings. The keys formerly synthesized via
    # INFOPLIST_KEY_* (display name, scene manifest, launch screen, orientations)
    # are re-declared here.
    info:
      path: WXYCDJ/Info.plist
      properties:
        CFBundleDisplayName: WXYC DJ
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - org.wxyc.dj.catalog.refresh
          - org.wxyc.dj.catalog.reindex
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.wxyc.dj
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: WXYCDJ/WXYCDJ.entitlements
    scheme:
      testTargets:
        - WXYCDJTests
      gatherCoverageData: false
      environmentVariables:
        WXYC_SPOTLIGHT_TOLERANCE: "1"
        WXYC_SPOTLIGHT_FIELD_RESOLUTION: "1"

  WXYCDJTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WXYCDJTests
    dependencies:
      - target: WXYCDJ
      - package: WXYCAPI
      - package: WXYCAPIModels
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.wxyc.dj.tests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: WXYCDJ.xcodeproj
  SCHEME: WXYCDJ

jobs:
  test:
    name: Test & Build
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List available Xcode versions
        run: ls /Applications | grep -i xcode

      - name: Select Xcode 26.2
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Show Swift version
        run: swift --version

      - name: Cache SwiftPM artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            Packages/WXYCAPI/.build
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved', '**/Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Run unit tests (WXYCAPI package)
        run: swift test --package-path Packages/WXYCAPI

      - name: Pre-boot iPhone simulator
        # Boot a simulator explicitly so xcodebuild test doesn't race CoreSimulator's
        # implicit boot on macos-latest runners under load. macos-latest is a moving
        # image whose installed simulator set varies run-to-run, so resolve the first
        # available modern iPhone from a preference list rather than pinning one exact
        # model; only fail (loudly) when no iPhone simulator exists at all (issue #26).
        id: simulator
        run: |
          AVAILABLE=$(xcrun simctl list devices available)
          DEVICE_ID=""
          for MODEL in "iPhone 16 Pro" "iPhone 17 Pro" "iPhone 16" "iPhone 17" "iPhone 18 Pro" "iPhone 18"; do
            # `|| true` keeps a no-match from aborting the step under `set -eo pipefail`.
            DEVICE_ID=$(printf '%s\n' "$AVAILABLE" | grep -m1 "$MODEL " | grep -oE '\([A-F0-9-]{36}\)' | tr -d '()' || true)
            if [ -n "$DEVICE_ID" ]; then
              echo "Selected simulator: $MODEL ($DEVICE_ID)"
              break
            fi
          done
          if [ -z "$DEVICE_ID" ]; then
            echo "No iPhone simulator available" >&2
            printf '%s\n' "$AVAILABLE"
            exit 1
          fi
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Build and test iOS app
        # Skip the Spotlight client-state tolerance probe: it's enabled by default
        # via the scheme's WXYC_SPOTLIGHT_TOLERANCE env var (so device runs pick it
        # up automatically), but Core Spotlight rejects client-state commits on the
        # Simulator (CSIndexError -1002), so it can only pass on a physical device.
        run: |
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.device_id }}" \
            -configuration Debug \
            -skip-testing:WXYCDJTests/SpotlightClientStateToleranceTests \
            CODE_SIGNING_ALLOWED=NO

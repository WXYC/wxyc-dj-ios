name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: WXYCDJ.xcodeproj
  SCHEME: WXYCDJ

jobs:
  test:
    name: Test & Build
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List available Xcode versions
        run: ls /Applications | grep -i xcode

      - name: Select Xcode 26.2
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Show Swift version
        run: swift --version

      - name: Cache SwiftPM artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            Packages/WXYCAPI/.build
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved', '**/Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Run unit tests (WXYCAPI package)
        run: swift test --package-path Packages/WXYCAPI

      - name: Pre-boot iPhone simulator
        # Boot a simulator explicitly so xcodebuild test doesn't race CoreSimulator's
        # implicit boot on macos-latest runners under load. macos-latest is a moving
        # image whose installed simulator set varies run-to-run, so resolve the first
        # available modern iPhone from a preference list rather than pinning one exact
        # model; only fail (loudly) when no iPhone simulator exists at all (issue #26).
        id: simulator
        run: |
          AVAILABLE=$(xcrun simctl list devices available)
          DEVICE_ID=""
          for MODEL in "iPhone 16 Pro" "iPhone 17 Pro" "iPhone 16" "iPhone 17" "iPhone 18 Pro" "iPhone 18"; do
            # `|| true` keeps a no-match from aborting the step under `set -eo pipefail`.
            DEVICE_ID=$(printf '%s\n' "$AVAILABLE" | grep -m1 "$MODEL " | grep -oE '\([A-F0-9-]{36}\)' | tr -d '()' || true)
            if [ -n "$DEVICE_ID" ]; then
              echo "Selected simulator: $MODEL ($DEVICE_ID)"
              break
            fi
          done
          if [ -z "$DEVICE_ID" ]; then
            echo "No iPhone simulator available" >&2
            printf '%s\n' "$AVAILABLE"
            exit 1
          fi
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Build and test iOS app
        # Skip the two device-only Spotlight probes. Both are enabled by default via
        # scheme env vars (WXYC_SPOTLIGHT_TOLERANCE / WXYC_SPOTLIGHT_FIELD_RESOLUTION)
        # so device runs pick them up automatically, but neither can pass on the
        # Simulator: the tolerance probe trips CSIndexError -1002 on client-state
        # commit, and the field-resolution probe relies on the Simulator's Spotlight
        # query path, which is unreliable. They still compile here (-skip-testing
        # skips execution, not the build) — run them by targeting a device destination
        # and dropping the -skip-testing flags.
        run: |
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.device_id }}" \
            -configuration Debug \
            -skip-testing:WXYCDJTests/SpotlightClientStateToleranceTests \
            -skip-testing:WXYCDJTests/SpotlightFieldResolutionTests \
            CODE_SIGNING_ALLOWED=NO

  verify-project:
    name: Verify generated project
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.2
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Install pinned XcodeGen
        # Pinned to `.xcodegen-version` rather than `brew install xcodegen`, which
        # tracks whatever is current: project.pbxproj is committed generated
        # output, so the generator version is part of its definition. The versions
        # disagree silently — 2.44.x and earlier do not recognise Xcode 26 `.icon`
        # bundles and dissolve WXYCDJ/AppIcon.icon into loose icon.json/logo.svg
        # resources, which still builds and ships a broken app icon.
        run: |
          VERSION=$(tr -d '[:space:]' < .xcodegen-version)
          echo "Pinned XcodeGen: $VERSION"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${VERSION}/xcodegen.zip"
          unzip -oq "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen-dist"
          "$RUNNER_TEMP/xcodegen-dist/xcodegen/bin/xcodegen" --version

      - name: Regenerate and require a zero diff
        # Nothing else in CI runs xcodegen — every other job consumes the committed
        # pbxproj — so a stale or wrong-generator project file reaches main
        # unnoticed. Regenerating here and failing on any diff makes project.yml
        # the single source of truth, and catches all three ways the pbxproj drifts:
        # a project.yml edit someone forgot to regen, a hand-edit, and a regen run
        # with the wrong xcodegen version.
        run: |
          "$RUNNER_TEMP/xcodegen-dist/xcodegen/bin/xcodegen" generate
          if ! git diff --quiet; then
            echo "::error::Generated project does not match project.yml. Regenerate with the version in .xcodegen-version and commit the result (see CLAUDE.md, 'Repo layout')."
            git --no-pager diff --stat
            git --no-pager diff
            exit 1
          fi
          echo "Generated project matches project.yml."
